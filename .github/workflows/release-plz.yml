name: release-plz

# release-plz watches main, opens a release PR that bumps versions and writes
# the changelog, and on merge tags, publishes to crates.io and drafts the
# GitHub release. `release.yml` then attaches binaries and publishes the draft.

permissions: {}

on:
  push:
    branches: [main]
  # Manual trigger. Note that this cannot conjure a release out of nothing:
  # release-plz compares packaged file contents against what is on crates.io
  # and opens a PR only when they differ. If it reports "already up to date",
  # the crate really is — publishing an identical tree under a new version is
  # not something worth adding a button for.
  workflow_dispatch:

jobs:
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    # Forks should never attempt to publish.
    if: ${{ github.repository_owner == 'jdx' }}
    permissions:
      contents: write
      # Required for crates.io trusted publishing: the OIDC token proves this
      # workflow, in this repository, is the configured publisher. No
      # long-lived CARGO_REGISTRY_TOKEN exists anywhere.
      id-token: write
    outputs:
      tag: ${{ steps.tak-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Exchanges the OIDC token for a short-lived crates.io token. Each crate
      # has a Trusted Publisher naming this repository and this workflow file,
      # so renaming this file breaks publishing — see RELEASING.md.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      # This is a workspace: a run can release `asset-picker`, `tak-cli`, or
      # both, in whatever order release-plz reports. Taking `releases[0]` would
      # sometimes hand the binary-upload job asset-picker's tag — attaching
      # `tak` binaries to the library's release and leaving tak-cli's draft
      # unpublished forever. Select by name instead.
      - name: Find the tak-cli tag
        id: tak-tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=""
          if [ -n "$RELEASES" ]; then
            tag=$(jq -r '[.[] | select(.package_name == "tak-cli")][0].tag // ""' <<<"$RELEASES")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tak-cli tag: ${tag:-<none released>}"

  # release-plz writes the body from commit subjects via cliff.toml. communique
  # replaces it with prose written from the commits, PRs and diffs. It runs
  # against the draft, in parallel with the seven binary builds, so the raw
  # version is never visible and the rewrite costs no extra wall clock.
  #
  # Nothing here is worth holding a release for: the cliff.toml notes are
  # already on the draft and perfectly serviceable. `continue-on-error` at the
  # job level — rather than on the communique step — so an install or checkout
  # failure is survivable too. The job still shows as failed, it just does not
  # block `publish-release`.
  enhance-release:
    name: Enhance release notes
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # communique diffs the new tag against the previous one, so it needs
          # the tags and the history between them.
          fetch-depth: 0
          persist-credentials: false

      # MISE_LOCKED makes a stale mise.lock a hard failure rather than a quiet
      # re-resolve. The whole point of locking communique is that this job stops
      # depending on what `latest` means today; without this it could drift back
      # without anyone noticing.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          MISE_LOCKED: "1"

      # The token has to be the PAT: the /releases/tags endpoint hides drafts,
      # so communique falls back to listing releases, which needs write access.
      - name: Rewrite the release body with communique
        env:
          TAG: ${{ needs.release-plz-release.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: communique generate "$TAG" --github-release

  # Binaries are attached to the draft, then the draft is published — so a
  # release is never visible without its assets.
  upload-assets:
    name: Upload assets
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}

  publish-release:
    name: Publish release
    needs: [release-plz-release, upload-assets, enhance-release]
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'jdx' }}
    permissions:
      contents: write
      pull-requests: write
    # Never run two of these at once: they would race the same branch.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
