name: perf

# Records tak's startup cost for every commit that lands on main, into the
# git-notes ref `refs/notes/tak`. The data lives in this repository — there is
# no external service holding it, and `git fetch origin refs/notes/tak:refs/notes/tak`
# gets you the whole history.
#
# Only runs post-merge. A PR-time gate is the eventual goal, but a gate needs a
# baseline series to compare against, and right now there is none. This builds
# that baseline.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# Never two at once. Concurrent runs race the notes push; tak retries with a
# cat_sort_uniq merge so nothing is lost, but serialising avoids the churn.
# cancel-in-progress is off deliberately: every commit gets a measurement, and
# a cancelled run is a hole in the series.
concurrency:
  group: perf
  cancel-in-progress: false

env:
  MBX_DISABLE: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build with GitHub-hosted Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image_version: ${{ steps.toolchain.outputs.image_version }}
      rust_version: ${{ steps.toolchain.outputs.rust_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        name: Record the built-in toolchain
        run: |
          image_version=${ImageVersion:?GitHub-hosted ImageVersion is unavailable}
          rust_version=$(rustc --version | awk '{print $2}')
          [[ "$image_version" =~ ^[0-9]{8}\.[0-9]+\.[0-9]+$ ]]
          [[ "$rust_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "rust_version=$rust_version" >> "$GITHUB_OUTPUT"
      - name: Build without a shared cache
        run: cargo build --release
      - name: Package the binary and toolchain identity
        run: |
          mkdir -p /tmp/tak-build
          install -m 0755 target/release/tak /tmp/tak-build/tak
          {
            rustc --version
            cargo --version
            echo "runner-image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } > /tmp/tak-build/build-info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tak-perf-binary
          path: /tmp/tak-build
          retention-days: 1
          if-no-files-found: error

  measure:
    name: Measure
    needs: build
    # Pinned to one runner class on purpose. Absolute instruction counts shift
    # between machine types by more than a real regression does, so a series
    # that wanders between runners is unreadable.
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      options: --cpuset-cpus 0-7
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAK_RUNNER: jdx-perf-v1-ubuntu24.04-x64-tak-gha${{ needs.build.outputs.image_version }}-rust${{ needs.build.outputs.rust_version }}-img5263c143
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tak-perf-binary
          path: /tmp/tak-build

      - name: Install the measured binary
        run: |
          mkdir -p target/release
          install -m 0755 /tmp/tak-build/tak target/release/tak

      # cachegrind is the whole point: it counts instructions, which reproduce
      # to ~0.02% run-to-run where wall clock on this same hardware moves by
      # 4-20%. Without it tak still records timing, but the series stops being
      # precise enough to detect anything.
      - name: Runner metadata
        run: |
          {
            echo '### Runner metadata'
            echo '```text'
            echo 'environment-revision: perf-runner@fd66d9b'
            echo 'image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68'
            uname -a
            lscpu
            cat /tmp/tak-build/build-info
            valgrind --version
            for zone in /sys/class/thermal/thermal_zone*/temp; do
              [ -r "$zone" ] && printf '%s: %s\n' "$zone" "$(cat "$zone")"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify valgrind
        run: valgrind --version

      - name: Measure and record
        run: taskset -c 0-3 ./target/release/tak run --record
      - name: Package measurement note
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/tak-out
          git notes --ref=tak show HEAD > /tmp/tak-out/note
          git rev-parse HEAD > /tmp/tak-out/sha

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.ref == 'refs/heads/main'
        with:
          name: tak-measurement
          path: /tmp/tak-out
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        run: ./target/release/tak history >> "$GITHUB_STEP_SUMMARY"

      # Job containers run as root, while bootstrap-host.sh creates gha-runner
      # as UID 1001. Hand the checkout back before the host cleanup hook runs.
      - name: Restore runner ownership
        if: always()
        run: chown -R 1001:1001 "$GITHUB_WORKSPACE"

  publish:
    name: Publish measurement note
    needs: measure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tak-measurement
          path: /tmp/tak-out

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish refs/notes/tak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sha=$(cat /tmp/tak-out/sha)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +refs/notes/tak:refs/notes/tak-remote || true
          if git rev-parse --verify --quiet refs/notes/tak-remote >/dev/null; then
            git update-ref refs/notes/tak refs/notes/tak-remote
          fi
          {
            git notes --ref=tak show "$sha" 2>/dev/null || true
            cat /tmp/tak-out/note
          } | LC_ALL=C sort -u > /tmp/tak-out/merged-note
          git notes --ref=tak add -f -F /tmp/tak-out/merged-note "$sha"

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            if git push --quiet "$remote" refs/notes/tak:refs/notes/tak; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not publish refs/notes/tak after five attempts"
              exit 1
            fi
            git fetch --quiet "$remote" +refs/notes/tak:refs/notes/tak-remote
            git notes --ref=tak merge -s cat_sort_uniq refs/notes/tak-remote
          done

  detect:
    name: Detect regressions that landed
    # After publish, so the measurement is in refs/notes/tak whether or not this
    # fails, and so the walk sees this commit's point beside the earlier ones.
    #
    # Today this job cannot fail on a step. Both of tak's benchmarks are
    # report-only in tak.toml (`gate = { enabled = false }`, reasons there), and
    # tak detect uses the same per-benchmark gates as tak compare. What it does
    # now is put steps, ranges and drift in the job summary, and fail if the
    # published measurement cannot be read back. It starts failing on steps
    # the day a benchmark in tak.toml is gated, with no change here.
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only: it fetches notes from this public repository and writes
    # nothing back, so it gets no token beyond the default read scope.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tak detect walks the first-parent commits between recorded points;
          # the default one-commit checkout leaves it nothing to walk.
          fetch-depth: 0
          persist-credentials: false

      # The binary this workflow built and measured from this commit, so the
      # check is the same tak that produced the numbers.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tak-perf-binary
          path: /tmp/tak-build

      - name: Install tak
        # Artifacts drop the executable bit.
        run: chmod +x /tmp/tak-build/tak

      # Proof this job has the data before anything may pass for want of it.
      # tak detect treats a failed notes refresh as "offline" and carries on
      # with what is local, which in this fresh checkout is nothing — and with
      # --allow-empty below that would pass without examining anything. So the
      # fetch must succeed, and the commit publish just wrote must carry an
      # instruction count that tak itself can read.
      #
      # Read through `tak history`, not by grepping the note: it goes through
      # the same parser detect uses, which skips malformed lines and records
      # from a newer schema, so text that merely contains "instructions" does
      # not count. This couples the check to history's output format — one line
      # per record with `instructions=<count>`, or `instructions=-` when there
      # is none. If that format changes, change this pattern with it.
      - name: Fetch the published measurements
        run: |
          git fetch --quiet origin '+refs/notes/tak:refs/notes/tak'
          history=$(/tmp/tak-build/tak history "$GITHUB_SHA")
          echo "$history"
          if ! grep -Eq 'instructions=[0-9]' <<<"$history"; then
            echo "::error::tak reads no instruction counts for $GITHUB_SHA in refs/notes/tak"
            exit 1
          fi

      # --allow-empty, deliberately, and only after the step above. TAK_RUNNER
      # embeds the GitHub image and Rust versions, so the runner class changes
      # on routine image and toolchain updates, and the first run after each
      # has no earlier point in its new series. Failing main for that would
      # make a red perf check routine, which is the fastest way to teach
      # everyone to ignore it. Every other way to compare nothing is ruled out
      # first: fetch-depth: 0 gives the walk its history, and the step above
      # proves this commit's instruction counts are here. What is left for the
      # flag to waive is a new runner class. A step onto this commit beyond
      # an enabled gate still fails; see the note at the top of this job for
      # why there are none today.
      - name: Detect
        run: |
          set -o pipefail
          /tmp/tak-build/tak detect --allow-empty | tee -a "$GITHUB_STEP_SUMMARY"
