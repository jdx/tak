name: release

# Builds a binary per target and attaches them to an existing release.
#
# Normally called by release-plz.yml against the draft it just created, so the
# release is only published once its assets are in place. `workflow_dispatch`
# is there for re-running a build that failed after the tag already existed.

permissions: {}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach binaries to, e.g. v0.1.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One target failing should not deny the others their artifacts.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # musl matters here beyond portability: `tak backfill` runs in slim
          # containers, and a static binary needs no libc to match.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # No x86_64-apple-darwin: Intel Macs are not a target we publish for.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # Cross-compiles and produces the archive. `dry-run` builds without
      # uploading, so a later target failing cannot leave a half-populated
      # release behind — everything is attached in one step at the end.
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: tak
          target: ${{ matrix.target }}
          # `cross` for the aarch64 Linux targets, plain cargo elsewhere.
          build-tool: ${{ startsWith(matrix.target, 'aarch64-unknown-linux') && 'cross' || 'cargo' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: true

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            tak-*.tar.gz
            tak-*.zip
          # Only needed long enough for the attach job to collect them.
          retention-days: 1
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The packslip is signed with this job's OIDC identity and its
      # artifacts are attested; neither is possible without these.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec mv {} release-assets/ \;
          ls -la release-assets/
          # An empty upload would silently produce a release with no binaries.
          [ -n "$(ls -A release-assets/)" ] || {
            echo "::error::no binaries were produced"; exit 1; }

      # Checksums let people verify a download, and `tak backfill` skips
      # sidecars when picking an asset, so they cost nothing downstream.
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" release-assets/* --repo "${{ github.repository }}" --clobber

      # SHA256SUMS says the files did not change in transit; the packslip
      # says who built them. It is one signed document holding every
      # archive's digest, the executable inside it, the shared objects it
      # needs from the host, and the build provenance of each file, signed
      # keylessly with this job's identity. `tak backfill` picking an asset
      # can check it against jdx/tak's identity with no key to distribute.
      # See https://packslip.dev.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false
      - name: Install completion syntax checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          mise install github:PowerShell/PowerShell@7.5.4
      - name: Publish the CLI specification and completions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p bin
          tar -xzf release-assets/tak-x86_64-unknown-linux-gnu.tar.gz -C bin
          bin/tak usage > tak.usage.kdl
          for shell in bash zsh fish powershell; do
            bin/tak completion "$shell" > tak.$shell
            test -s tak.$shell
            grep -Fq '__complete_word__' tak.$shell
            bin/tak __complete_word__ --shell "$shell" --line 'tak ru' | grep -Fq -- 'run'
          done
          bash -n tak.bash
          zsh -n tak.zsh
          fish --no-execute tak.fish
          cat > completion-syntax-check.ps1 <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          foreach ($script in Get-ChildItem -LiteralPath "." -Filter '*.powershell') {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count) { $parseErrors | Write-Error; exit 1 }
          }
          POWERSHELL
          mise exec github:PowerShell/PowerShell@7.5.4 -- pwsh -NoProfile -File completion-syntax-check.ps1
          gh release upload "$TAG" tak.usage.kdl tak.bash tak.zsh tak.fish tak.powershell --repo "$REPO" --clobber
      - uses: jdx/packslip@a0d434ad57571c62dbd0ab5095b4eff607a71fd3 # v1.1.1
        with:
          tag: ${{ inputs.tag }}
          artifacts: release-assets/tak-*.tar.gz release-assets/tak-*.zip
          bin: tak
          resources: |
            cli-spec/usage=asset:tak.usage.kdl
            completion/bash=asset:tak.bash
            completion/zsh=asset:tak.zsh
            completion/fish=asset:tak.fish
            completion/powershell=asset:tak.powershell

      # Called from release-plz.yml, undrafting is that workflow's job — it
      # happens after this one returns. Run by hand, nothing else will do it,
      # and the release would sit drafted forever. Since manual dispatch is the
      # documented recovery for a build that failed after the tag existed, that
      # would leave the recovery path itself broken.
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
