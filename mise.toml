[tools]
# communique rewrites release bodies; Node builds the docs; usage renders the
# CLI reference. Rust-only CI jobs run mise-action with `install: false` and
# dedicated jobs install only what they need. Rust itself comes from
# rust-toolchain in CI and rustup locally.
#
# Resolved by mise.lock, not floating: 1.2.3 cleared a draft release's tag_name
# while rewriting the body, and v0.0.3, v0.0.4 and v0.0.5 each shipped as an
# untagged draft because of it. Bump with `mise lock`, deliberately.
communique = "latest"
node = "24"
usage = "latest"

[tasks.build]
description = "Build the debug binary"
run = "cargo build"

# Instruction-counted benchmarks (see tak.toml). The just-built release binary
# is the measuring instrument, so this exercises the same source revision as
# the benchmark subject without relying on a separately installed tak.
[tasks.perf]
description = "Build release mode and run the performance benchmarks"
run = ["cargo build --release", "./target/release/tak run"]

# Same measurement, appended to refs/notes/tak for this commit. Nothing leaves
# the machine until `tak push`; the perf workflows are the publisher.
[tasks."perf:record"]
description = "Record the performance benchmarks in git notes"
run = ["cargo build --release", "./target/release/tak run --record"]

[tasks.test]
description = "Run the test suite, including the cachegrind integration tests"
# --all-targets so tests/counters.rs is included. Without valgrind installed it
# skips rather than fails, which is the normal state on macOS and Windows.
run = "cargo test --all-targets"

[tasks.lint]
description = "Check formatting and run clippy"
depends = ["lint:fmt", "lint:clippy"]

[tasks."lint:fmt"]
description = "Check formatting"
run = "cargo fmt --check"

[tasks."lint:clippy"]
description = "Run clippy, warnings as errors"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.lint-fix]
description = "Auto-fix formatting and the clippy lints that can be fixed"
run = [
    "cargo fmt",
    "cargo clippy --all-targets --fix --allow-dirty --allow-staged -- -D warnings",
]

[tasks.ci]
description = "Everything CI runs"
depends = ["build", "test", "lint", "docs:check"]

[tasks.docs]
description = "Run the documentation site locally"
dir = "docs"
run = "npm install && exec npm run docs:dev"

[tasks."docs:build"]
description = "Build the documentation site"
dir = "docs"
run = "npm ci && exec npm run docs:build"

[tasks."docs:check"]
description = "Check generated references and build the documentation site"
depends = ["render:check"]
dir = "docs"
run = "npm ci && exec npm run docs:build"

[tasks.render]
description = "Regenerate the CLI reference from usage metadata"
depends = ["build"]
run = [
    "./target/debug/tak usage > tak.usage.kdl",
    "rm -rf docs/cli && mkdir -p docs/cli",
    "usage generate markdown --multi -f tak.usage.kdl --out-dir docs/cli --url-prefix /cli",
    "usage generate json -f tak.usage.kdl > docs/cli/commands.json",
]

[tasks."render:check"]
description = "Fail when the generated CLI reference is stale"
depends = ["render"]
run = [
    "git diff --exit-code -- tak.usage.kdl docs/cli",
    '''
untracked=$(git ls-files --others --exclude-standard -- tak.usage.kdl docs/cli)
if [ -n "$untracked" ]; then
  echo "untracked generated files:" >&2
  echo "$untracked" >&2
  exit 1
fi
''',
]

[tasks.docker]
description = "Build the container image that carries valgrind"
# Context is the repository root, not docker/ — the build stage needs Cargo.toml
# and the sources.
run = "docker build -f docker/Dockerfile -t tak ."
