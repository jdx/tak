[workspace]
members = ["crates/asset-picker"]

[package]
name = "tak-cli"
version = "0.0.0"
edition = "2024"
description = "Benchmark command-line programs and track their performance over time. Experimental; do not use."
license = "MIT"
repository = "https://github.com/jdx/tak"
publish = false

[lib]
name = "tak_cli"
path = "src/lib.rs"

[[bin]]
name = "tak"
path = "src/main.rs"

[dependencies]
anyhow = "1"
asset-picker = { path = "crates/asset-picker" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
