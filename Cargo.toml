[workspace]
members = ["crates/asset-picker"]

[package]
name = "tak-cli"
version = "0.0.6"
edition = "2024"
description = "Pre-v1 command-line benchmarking and performance tracking"
keywords = ["benchmark", "performance", "cli", "git-notes"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
# Published crates carry the source and its licence, not the machinery used to
# develop and ship it. Everything below is repository furniture.
exclude = [
    ".github/",
    ".gitignore",
    "docs/",
    "docker/",
    "AGENTS.md",
    "CLAUDE.md",
    "cliff.toml",
    "communique.toml",
    "mise.toml",
    "release-plz.toml",
    "renovate.json",
    "RELEASING.md",
    "tak.usage.kdl",
]
license = "MIT"
repository = "https://github.com/jdx/tak"

[lib]
name = "tak_cli"
path = "src/lib.rs"

[[bin]]
name = "tak"
path = "src/main.rs"

[dependencies]
anyhow = "1"
asset-picker = { path = "crates/asset-picker", version = "0.0.2" }
usage-rs = { git = "https://github.com/jdx/usage", rev = "f9ea7a760077edcef4ee3e748c977ed340004430", features = ["diagnostics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
toml = "1"
